name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: |
          flutter create --platforms=android --project-name famikura_list --org com.example .
          rm -rf test
      - name: Disable R8 minify (ML Kit missing-class fix)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("debug")\n            isMinifyEnabled = false\n            isShrinkResources = false/' android/app/build.gradle.kts
            grep -n -A6 "release {" android/app/build.gradle.kts
          else
            sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.debug\n            minifyEnabled false\n            shrinkResources false/' android/app/build.gradle
            grep -n -A6 "release {" android/app/build.gradle
          fi
      - name: Add ML Kit Japanese model dependency
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            printf '\ndependencies {\n    implementation("com.google.mlkit:text-recognition-japanese:16.0.1")\n}\n' >> android/app/build.gradle.kts
            tail -5 android/app/build.gradle.kts
          else
            printf "\ndependencies {\n    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'\n}\n" >> android/app/build.gradle
            tail -5 android/app/build.gradle
          fi
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: famikura-list-apk
          path: build/app/outputs/flutter-apk/app-release.apk

