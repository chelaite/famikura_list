name: famikura_list
description: Famikura cart screenshot number extractor
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ">=0.13.1 <0.16.0"
  image: ^4.2.0
  excel: ^4.0.6
  share_plus: ^10.1.4
  path_provider: ^2.1.5

flutter:
  uses-material-design: true

dev_dependencies:
  flutter_launcher_icons: "^0.14.4" # 请根据最新版本调整，或者直接用最新版

flutter_launcher_icons:
  image_path: "assets/icon/icon.png" # 你的图标源文件路径
  android: true